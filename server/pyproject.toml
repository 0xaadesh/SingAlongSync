[project]
name = "sing-along-sync"
version = "0.1.0"
description = "A CLI tool to obtain word-by-word Apple Music Sing-Along-like synced lyrics using open-source WhisperX and lyrics from LRCLIB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beat-this",
    "demucs>=4.0.1",
    "einops>=0.8.2",
    "fastapi>=0.136.1",
    "indic-transliteration>=2.3.82",
    "librosa>=0.11.0",
    "nnaudio==0.3.3",
    "pydantic-ai-slim[anthropic,google,groq,openai]>=2.55.0",
    "python-dotenv>=1.2.2",
    "requests>=2.28.1",
    "rich>=13.7.0",
    "torch>=2.6,<2.8",
    "torchaudio>=2.6,<2.8",
    "torchvision>=0.21,<0.23",
    "uvicorn>=0.46.0",
    "whisperx>=3.4.5",
    "yt-dlp[default]>=2026.8.19",
    "ytmusicapi>=1.12.3",
]


# Only torch packages come from the CUDA index; everything else resolves on PyPI.
# torch >= 2.6 is required: transformers refuses to load .bin alignment models
# (e.g. Malayalam) on older torch (CVE-2025-32434). < 2.8 because newer
# torchaudio drops the audio I/O Demucs uses.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
beat-this = { git = "https://github.com/CPJKU/beat_this", rev = "b95c8ab0c58c2d9fcfd40508ae8dffbc05ac4f5c" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
